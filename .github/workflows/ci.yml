name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are not, so every
# commit that lands there keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install 3.11
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install 3.11
      - run: uv sync --locked --group dev
      - run: uv run mypy src/prometheon

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev
      # Every test, not a marker subset. An earlier version ran `-m unit` and
      # `-m contract` only, which silently excluded the end-to-end cycle tests,
      # the ones that check the modules actually compose, and the only place a
      # field renamed in one module and read by another is caught. Nothing here
      # touches the network: the DB layer, the chain, the labeller and every
      # miner model are fakes.
      #
      # `--strict-markers` is on, so an unmarked test fails rather than being
      # quietly skipped by a marker filter.
      - run: uv run pytest -ra
      - name: Every test carries a marker
        run: |
          uv run pytest --collect-only -q \
            -m "not unit and not contract and not integration" 2>&1 | tee /tmp/unmarked.txt
          grep -q "no tests collected" /tmp/unmarked.txt



  security:
    name: bandit (static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install 3.11
      - run: uv sync --locked --group dev
      - run: uv run --with bandit bandit -r src/prometheon -ll -q

  audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install 3.11
      - run: uv sync --locked --group dev
      - run: uv run --with pip-audit pip-audit --skip-editable

  signatures:
    name: verify pushed commits are signed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Asks GitHub rather than git: verifying an SSH signature locally needs
      # the signer's key in an allowed_signers file, which a runner does not
      # have, so `git log --pretty=%G?` reports "N" for correctly signed
      # commits and the check can never pass.
      - name: Fail on unverified commits in PR range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          unverified=""
          for sha in $(git rev-list "$BASE..$HEAD"); do
            verdict="$(gh api "repos/$REPO/commits/$sha" \
              --jq '.commit.verification.verified, .commit.verification.reason' | paste -sd' ')"
            echo "$sha $verdict"
            case "$verdict" in
              true*) ;;
              *) unverified="$unverified$sha $verdict"$'\n' ;;
            esac
          done
          if [[ -n "$unverified" ]]; then
            echo "::error::Unverified commits in this PR:"
            printf '%s' "$unverified"
            exit 1
          fi
