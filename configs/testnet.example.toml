# Prometheon V2, testnet (netuid 481).
#
# Copy this to a local file and edit [wallet]. Everything else is pre-pinned.
#
#   cp configs/testnet.example.toml ~/prometheon-testnet.toml

[chain]
network = "test"
netuid = 481
version_key = 0
fail_on_weights_version_mismatch = true
# Localnet only. On a live network, weights submitted without a mechid land on
# whatever mechanism the chain defaults to and nothing reports it.
allow_missing_mechid = false

[wallet]
# Your btcli wallet (coldkey directory) and the hotkey registered on 481.
name = "validator"
hotkey = "default"

[hub]
# Where the signed daily epoch comes from and where results go. The address is
# published with each release; this placeholder resolves nowhere on purpose.
base_url = "https://hub.prometheon.invalid"
request_timeout_seconds = 60.0
max_retries = 3

[hub.epoch_keys]
# The hub's Ed25519 public key, 64 lowercase hex, under its key id, copied from
# the release notes of the version you run. Never copy it from the hub itself:
# a key the hub could hand you is a signature that proves nothing. A validator
# refuses to score while this table is empty.

[labelling]
# Ground truth. Validators pay for this with their own key.
#
# Any OpenAI-compatible endpoint works: the three settings below are all that
# distinguishes one provider from another, so switching needs no code change.
# Two that are known to work, and the differences that bite:
#
#   OpenAI      model       = "gpt-5.6-sol"
#               base_url    = "https://api.openai.com/v1"
#               api_key_env = "OPENAI_API_KEY"
#
#   OpenRouter  model       = "openai/gpt-5.6-sol"     <- provider prefix
#               base_url    = "https://openrouter.ai/api/v1"
#               api_key_env = "OPENROUTER_API_KEY"
#
# The model id is not portable. OpenRouter namespaces every model by provider,
# so a bare "gpt-5.6-sol" against its base_url is a 404 on the first labelling
# call -- which is a whole cycle spent to discover a typo. Change all three
# together or none.
#
# `api_key_env` names the variable, never the key. Whatever it names has to be
# exported in the environment the cycle runs in; a loop that sources an env
# file once at start will not see a key added afterwards until it restarts.
model = "gpt-5.6-sol"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# The gpt-5 reasoning line accepts only its own default of 1 and rejects an
# explicit 0 with HTTP 400, so a config that leaves this unset fails every
# cycle at labelling. Set 0 only if you switch `model` to one that allows it:
# 0 is what keeps ground truth from wandering between validators.
temperature = 1.0
batch_size = 100

[evaluation]
# Running miners' models on this validator's own hardware.
batch_size = 100
# Ceiling on a submitted model's weights. Every validator downloads and runs
# every eligible model, so this decides what hardware validating costs: 24 GiB
# leaves headroom on a 32 GB card, which is the floor a validator is expected
# to own. Enforced from the Hugging Face API before anything is downloaded.
max_weight_bytes = 25769803776
# Pinned, not inferred. The same checkpoint in float16 and bfloat16 puts
# different mass on YES and NO, so a near-tie can flip between two validators
# that differ only in a default.
torch_dtype = "float16"
# "auto" takes CUDA when present and falls back to CPU, which is fine for a dry
# run and unusable for a real cycle. Validating needs 8 x RTX 5090 or better:
# every eligible model is downloaded and run over the whole corpus, daily.
device = "auto"
model_timeout_seconds = 3600.0

[scoring]
# These decide emissions. Every share is a slice of total emission, not a ratio
# of a pool, and whatever nobody claims burns to the subnet owner hotkey. Every
# validator must run the same values: they are not enforced by consensus, so a
# different value computes a different vector from identical inputs and costs
# vtrust.
#
# Data contribution: 70% of total emission, split by score across the top 10
# miners scoring above zero.
dataset_share_bp = 7000
dataset_top_n = 10
# Models: 25%, 4% and 1% of total emission to the first, second and third model.
# A rank nobody fills burns, so one model alone collects 25% and 5% burns.
model_rank_shares_bp = [2500, 400, 100]
# The entry gate, for both pools: a miner counts only with at least this many
# identity-verified active members. The hub's own flag must agree as well.
min_verified_active_members = 10
# Items whose normalised text has 64-bit SimHashes within this many bits are one
# item, and only the earliest counts. The same value on every validator.
near_duplicate_max_hamming = 3
# A model scored on fewer items than this is not ranked at all. Accuracy over a
# handful of items is noise, and a miner can shrink its own corpus by supplying
# most of a day's test content; its own items are excluded from what it is
# scored on.
model_min_scored_items = 100
efficiency_lambda_bp = 1500
efficiency_min_cv_bp = 1000
# Where this validator's weight vector comes from.
#
#   "local"    score the day yourself: label the corpus, run every eligible
#              model, reduce it here. This is what the subnet's trust model
#              assumes and what keeps consensus meaningful.
#   "endpoint" submit another validator's published, signed record instead.
#              No labelling bill, no GPU -- and no independent opinion.
#
# Mirroring is a real option and worth being clear-eyed about. Consensus works
# by validators disagreeing when one of them is wrong; a field where most weight
# mirrors one provider cannot detect that provider being wrong, because the
# agreement is manufactured rather than earned. The signature proves who
# computed the vector, never that it is correct.
score_source = "local"
# The validator hotkey whose record to mirror. Required when score_source is
# "endpoint", ignored otherwise. Pinned here rather than left to whoever answers:
# the record is verified against this address, so a DB layer serving somebody
# else's record fails the check instead of being submitted.
score_provider = ""


[validator]
state_directory = ".validator-state"
submit_weights = true
dry_run = false
submit_results = true

[miner]
# Miners only. The values `prometheon model commit` writes on chain.
hf_repo = ""
# The 40-character commit SHA, not a branch.
hf_revision = ""
