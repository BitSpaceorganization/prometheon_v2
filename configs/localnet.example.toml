# Prometheon on a local development chain: the whole cycle with real
# extrinsics and nothing public. docs/localnet.md walks through starting the
# chain, registering a subnet and running a cycle against a local hub.

[chain]
# The opentensor subtensor localnet image, published on this port.
network = "ws://127.0.0.1:9945"
# REQUIRED: the netuid `btcli subnet create` printed on your local chain.
netuid = 0
version_key = 0
# Off for localnet only: a dev chain will not match a deployed version key.
fail_on_weights_version_mismatch = false
# Also localnet only. A dev chain may be running an SDK build whose set_weights
# takes no mechid; on a live network that means the weights land on whatever
# mechanism the chain defaults to, silently, so this stays false anywhere real.
allow_missing_mechid = true

[wallet]
name = "validator"
hotkey = "default"

[hub]
# A hub on this machine, for development. Nothing here reaches a real service.
base_url = "http://127.0.0.1:8600"
request_timeout_seconds = 10.0
max_retries = 0

[hub.epoch_keys]
# The local hub's Ed25519 public key, 64 lowercase hex, under its key id.

[labelling]
# A local OpenAI-compatible server. Any hosted provider works here too -- see
# the finney example for the OpenAI and OpenRouter settings, and for why the
# model id has to change with the base_url rather than independently of it.
model = "gpt-5.6-sol"
base_url = "http://127.0.0.1:8601/v1"
api_key_env = "OPENAI_API_KEY"
# The gpt-5 reasoning line accepts only its own default of 1 and rejects an
# explicit 0 with HTTP 400, so a config that leaves this unset fails every
# cycle at labelling. Set 0 only if you switch `model` to one that allows it:
# 0 is what keeps ground truth from wandering between validators.
temperature = 1.0
# Each request carries one post. This many are open at once.
max_in_flight = 8

[evaluation]
# A local chain runs models on its CPU, which needs float32.
device = "cpu"
torch_dtype = "float32"

[validator]
# "score" does the day's work: label every post, run every eligible model, and
# submit what you measured. "copy" submits the owner validator's weights
# unchanged, with no GPU and no labelling key. A copying validator has no
# opinion of its own: the owner validator's results decide its weights. See
# docs/validator.md before choosing.
mode = "score"
# The owner validator's hotkey, which copy mode copies and no other. It is
# published with the launch; until then this is a placeholder that copy mode
# refuses. Score mode ignores it.
copy_from = "<owner validator hotkey, published with the launch>"
state_directory = ".validator-state"
submit_weights = false
dry_run = true
submit_results = false

[update]
# Move to each new release tag on your own: `prometheon validator schedule`
# checks every 30 minutes, and so does the shipped systemd timer. Only release
# tags vX.Y.Z from your install's own origin, newer than the version running,
# installed beside it and checked before anything switches. Off unless you turn
# it on. See docs/validator.md.
auto = false
# systemd units to restart once a new release is current, for a process that
# keeps running. The shipped units start fresh every time and need none.
restart_units = []

[credits]
# The treasury coldkey that submission fees are paid to. REQUIRED before
# `prometheon credits buy` will send anything; published with the release that
# launches the subnet. Can also come from PROMETHEON_TREASURY_COLDKEY.
treasury_coldkey = ""
# The fee itself is not a setting: 50 alpha per credit, fixed by the published
# rules. See docs/miner.md.

[miner]
hf_repo = ""
# The 40-character commit SHA, not a branch.
hf_revision = ""
